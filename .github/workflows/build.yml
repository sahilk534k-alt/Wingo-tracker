name: Build WinGo Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WinGoTrackerAndroid_source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -o WinGoTrackerAndroid_source.zip -d source
          PROJECT_DIR=$(find source -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            find source -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WinGo-Tracker-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
