name: Build WinGo Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WinGoTrackerAndroid_source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Android Project
        run: |
          mkdir -p source
          unzip -o WinGoTrackerAndroid_source.zip -d source
          PROJECT_DIR=$(find source -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Java Compatibility & Generate Wrapper
        run: |
          APP_GRADLE="${{ env.PROJECT_DIR }}/app/build.gradle.kts"
          
          # Inject compileOptions and kotlinOptions into app/build.gradle.kts
          cat << 'EOF' >> "$APP_GRADLE"

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          # Install Gradle and generate wrapper
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/gradle-8.9/bin:$PATH"
          
          cd "${{ env.PROJECT_DIR }}"
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinGo-Tracker-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
